---
tailscale_dependencies:
  - gnupg
  - gnupg-agent
  - apt-transport-https
  - python3-apt
  # Required on the target by ansible.builtin.deb822_repository.
  - python3-debian
tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_repo: https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
tailscale_signkey: https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ tailscale_keyfile }}
tailscale_keyfile: "{{ ansible_facts['distribution_release'] | lower }}.noarmor.gpg"
