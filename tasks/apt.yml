---
- name: Install apt dependencies
  ansible.builtin.apt:
    cache_valid_time: 3600
    name: "{{ tailscale_dependencies }}"
    state: present

- name: Add Tailscale signing key
  become: true
  ansible.builtin.get_url:
    url: "{{ tailscale_signkey }}"
    dest: "{{ tailscale_keyring }}"
    mode: '0644'

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_repo }}"
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components: main
    signed_by: "{{ tailscale_keyring }}"
    state: present
  register: tailscale_apt_repository

- name: Update apt cache
  ansible.builtin.apt:
    cache_valid_time: "{{ 0 if tailscale_apt_repository is changed else 3600 }}"
    update_cache: true
