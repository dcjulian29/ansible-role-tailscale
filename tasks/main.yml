---
- name: Wait for systemd to complete initialization.  # noqa command-instead-of-module
  ansible.builtin.command: systemctl is-system-running
  register: systemctl_status
  until: >
    'running' in systemctl_status.stdout or
    'degraded' in systemctl_status.stdout
  retries: 30
  delay: 5
  when: ansible_facts['service_mgr'] == 'systemd'
  changed_when: false
  check_mode: false
  failed_when:
    - systemctl_status.rc != 0
    - not (systemctl_status.rc == 1 and 'degraded' in systemctl_status.stdout )

- name: Load variables based on the package manager
  ansible.builtin.include_vars: "{{ ansible_facts['pkg_mgr'] }}.yml"

- name: Install dependencies based on the package manager
  ansible.builtin.include_tasks: "{{ ansible_facts['pkg_mgr'] }}.yml"

- name: Install Tailscale
  ansible.builtin.package:
    name: "{{ tailscale_package }}"
    state: "{{ tailscale_state }}"

- name: Enable and start Tailscale service
  ansible.builtin.service:
    name: "{{ tailscale_service }}"
    state: started
    enabled: true

- name: Fetch Tailscale status
  ansible.builtin.command: tailscale status --json
  changed_when: false
  check_mode: false
  register: tailscale_status

- name: Parse Tailscale status JSON
  vars:
    tailscale_status_parsed: "{{ tailscale_status.stdout | from_json }}"
  ansible.builtin.set_fact:
    tailscale_is_running: "{{ tailscale_status_parsed.BackendState == 'Running' }}"

- name: Prepend 'tag:' to each item in the list
  ansible.builtin.set_fact:
    tailscale_prepared_tags: "{{ tailscale_tags | map('regex_replace', '^', 'tag:') | list }}"

- name: Build `tailscale up` arguments strings
  ansible.builtin.set_fact:
    tailscale_authkey_type: >-
      {% if tailscale_authkey.startswith('tskey-client-') %}
      OAuth Client Secret
      {% elif tailscale_authkey.startswith('tskey-auth-') %}
      API Token
      {% else %}
      Unknown token format
      {% endif %}
    tailscale_authkey_string: >-
      {% if tailscale_authkey.startswith('tskey-client-') %}
      {{ tailscale_authkey }}?ephemeral={{ tailscale_oauth_ephemeral | bool -}}
      &preauthorized={{ tailscale_oauth_preauthorized | bool }}
      {% else %}
      {{ tailscale_authkey }}
      {% endif %}
    tailscale_tags_string: >-
      {% if tailscale_tags | length > 0 %}
      --advertise-tags={{ tailscale_prepared_tags | join(',') }}
      {% endif %}

- name: Build the final tailscale_args
  ansible.builtin.set_fact:
    tailscale_args_string: "{{ tailscale_args }} {{ tailscale_tags_string | trim }} --timeout=120s"

- name: Bring Tailscale up
  ansible.builtin.command: >-
   tailscale up {{ tailscale_args_string | trim }}
   --authkey={{ tailscale_authkey_string | trim }}
  changed_when: true
  when:
    - not tailscale_up_skip
    - not tailscale_is_running
  async: 130
  poll: 5

- name: Enable IPv4 and IPv6 forwarding when exit node
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop:
    - key: net.ipv4.ip_forward
      value: 1
    - key: net.ipv6.conf.all.forwarding
      value: 1
  when: tailscale_exit_node

- name: Read the current Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: __tailscale_prefs
  changed_when: false
  check_mode: false
  when: tailscale_exit_node

- name: Update Tailscale to be an exit node
  ansible.builtin.command: >-
   tailscale set
   --advertise-routes={{ tailscale_exit_routes | join(',') }}
   --advertise-exit-node
  changed_when: true
  async: 130
  poll: 5
  when:
    - tailscale_exit_node
    - >-
      ((__tailscale_prefs.stdout | from_json).AdvertiseRoutes | default([], true) | sort)
      != ((tailscale_exit_routes + ['0.0.0.0/0', '::/0']) | sort)

- name: Update Tailscale use an exit node
  ansible.builtin.command: >-
   tailscale set
   --exit-node {{ tailscale_exit_node_use }}
  changed_when: true
  async: 130
  poll: 5
  when: tailscale_exit_node_use | length > 0

- name: Configure Tailscale serve
  when: tailscale_serve | length > 0
  block:
    - name: Fetch Tailscale serve config
      ansible.builtin.command: tailscale serve status --json
      changed_when: false
      check_mode: false
      register: tailscale_serve_status

    - name: Compare the serve config with tailscale_serve
      vars:
        tailscale_serve_web: "{{ (tailscale_serve_status.stdout | from_json).Web | default({}) }}"
      ansible.builtin.set_fact:
        tailscale_serve_current: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for host_port, web in tailscale_serve_web.items() -%}
          {%- for path, handler in (web.Handlers | default({})).items() -%}
          {%- set ns.items = ns.items + [host_port.split(':') | last ~ '|' ~ path ~ '|' ~ (handler.Proxy | default(''))] -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.items | sort | join(',') }}
        tailscale_serve_desired: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for serve in tailscale_serve -%}
          {%- set ns.items = ns.items + [serve.port ~ '|/|' ~ serve.target] -%}
          {%- endfor -%}
          {{ ns.items | sort | join(',') }}

    - name: Reset the Tailscale serve config
      ansible.builtin.command: tailscale serve reset
      changed_when: true
      when: tailscale_serve_current != tailscale_serve_desired

    - name: Serve local services on the tailnet
      ansible.builtin.command: >-
       tailscale serve --bg --https={{ item.port }} {{ item.target }}
      changed_when: true
      loop: "{{ tailscale_serve }}"
      loop_control:
        label: "{{ item.port }} -> {{ item.target }}"
      when: tailscale_serve_current != tailscale_serve_desired
