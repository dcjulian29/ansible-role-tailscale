---
tailscale_args: ""
# OAuth key starts with 'tskey-client-', auth key starts with 'tskey-auth-', with headscale it can be 'unused'
tailscale_authkey: ""
tailscale_exit_node: false
tailscale_exit_routes: []
# - 10.10.10.10/8
# - 192.168.0.0/24
tailscale_exit_node_use: ""
# Register as an ephemeral node. Ephemeral nodes are removed from the tailnet
# soon after they go offline, so a server would lose its name (and any
# `tailscale serve` URL) across a reboot. Only enable for short-lived hosts.
tailscale_oauth_ephemeral: false
# Skip manual device approval
tailscale_oauth_preauthorized: false
# Publish local services on https://<host>.<tailnet>.ts.net with a certificate
# Tailscale issues. Requires MagicDNS and HTTPS certificates enabled in the
# tailnet admin console. The role owns the node's whole serve config: when it
# differs from this list it is reset and rebuilt, so removing an entry here
# removes it from the node. An empty list leaves the serve config untouched.
tailscale_serve: []
# - port: 443                       # HTTPS port on the tailnet name
#   target: http://127.0.0.1:2283   # local backend to proxy to
tailscale_state: latest
tailscale_tags: []
tailscale_up_skip: false
